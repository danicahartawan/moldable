<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" fill="none">
<style>
.steam{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.steam2{animation-delay:.8s}.steam3{animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(14px) scaleY(.8)}40%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scaleY(1.15)}}
.toss{animation:toss 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes toss{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(2deg)}}
.whirl{animation:whirl 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes whirl{0%,100%{transform:translateX(-7px) skewX(-4deg)}50%{transform:translateX(7px) skewX(4deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0.10 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
</defs>
<g filter="url(#paper)" stroke="#2b3036" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="320" cy="300" rx="150" ry="9" fill="#ced2d2" stroke="none"/><rect x="262" y="245" width="116" height="46" rx="10" fill="#cfd3d3"/><rect x="276" y="284" width="88" height="10" rx="4" fill="#aeb3b3"/><path d="M250 70 L 390 70 L 372 245 L 268 245Z" fill="#dff0ff" /><g class="whirl"><path d="M262 150 L 378 150 L 372 245 L 268 245Z" fill="#c9f1ee" stroke="none"/></g><path d="M262 150 C 290 140 340 160 378 150" fill="none" /><rect x="246" y="54" width="148" height="20" rx="8" fill="#acd1ff"/><rect x="300" y="38" width="40" height="18" rx="6" fill="#87e0dc"/><ellipse cx="320" cy="232" rx="10" ry="10" fill="#ffffff" stroke-width="1.5"/><g class="bob"><g transform="translate(130 230) scale(1.35)"><path d="M0 -34 C 8 -28 10 -22 8 -18 C 34 -14 40 22 0 36 C -40 22 -34 -14 -8 -18 C -10 -22 -8 -28 0 -34Z" fill="#acd1ff" /><path d="M0 -18 C -14 -4 -14 20 0 34 M0 -18 C 14 -4 14 20 0 34" fill="none" stroke-width="1.5"/></g><g transform="translate(120 140) rotate(-20) scale(1.3)"><path d="M-34 -6 C -10 -22 28 -12 38 14 C 14 8 -14 6 -34 -6Z" fill="#ff89cb" /><path d="M-34 -6 C -40 -14 -42 -18 -38 -22" fill="none" stroke="#3aa8a3"/></g></g><g class="bob" style="animation-delay:.7s"><g transform="translate(205 262) scale(1.0)"><path d="M0 -30 C 6 -24 8 -20 6 -16 C 30 -10 32 24 0 28 C -32 24 -30 -10 -6 -16 C -8 -20 -6 -24 0 -30Z" fill="#ffffff" /><path d="M0 -16 C -9 -2 -9 14 0 26 M0 -16 C 9 -2 9 14 0 26" fill="none" stroke-width="1.5"/></g><g transform="translate(470 240) rotate(-15) scale(1.2)"><path d="M-34 0 C -14 -22 14 -22 34 0 C 14 22 -14 22 -34 0Z" fill="#87e0dc" /><path d="M-34 0 L 34 0" fill="none" stroke-width="1.3"/></g><g transform="translate(520 275) scale(0.9)"><ellipse cx="0" cy="0" rx="28" ry="28" fill="#d5cf00" /><ellipse cx="0" cy="0" rx="21" ry="21" fill="#f2f0a6" stroke-width="1.5"/><line x1="-21.0" y1="-0.0" x2="21.0" y2="0.0" stroke-width="1.2"/><line x1="-18.2" y1="-10.5" x2="18.2" y2="10.5" stroke-width="1.2"/><line x1="-10.5" y1="-18.2" x2="10.5" y2="18.2" stroke-width="1.2"/><line x1="-0.0" y1="-21.0" x2="0.0" y2="21.0" stroke-width="1.2"/><line x1="10.5" y1="-18.2" x2="-10.5" y2="18.2" stroke-width="1.2"/><line x1="18.2" y1="-10.5" x2="-18.2" y2="10.5" stroke-width="1.2"/></g></g><g class="bob" style="animation-delay:1.3s"><g transform="translate(540 205) rotate(25) scale(1.0)"><path d="M-34 0 C -14 -22 14 -22 34 0 C 14 22 -14 22 -34 0Z" fill="#87e0dc" /><path d="M-34 0 L 34 0" fill="none" stroke-width="1.3"/></g><g transform="translate(470 150) scale(0.8)"><path d="M0 -30 C 6 -24 8 -20 6 -16 C 30 -10 32 24 0 28 C -32 24 -30 -10 -6 -16 C -8 -20 -6 -24 0 -30Z" fill="#ffffff" /><path d="M0 -16 C -9 -2 -9 14 0 26 M0 -16 C 9 -2 9 14 0 26" fill="none" stroke-width="1.5"/></g></g>
</g></svg>