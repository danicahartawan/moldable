<svg xmlns="http://www.w3.org/2000/svg" viewBox="91 98 458 205" fill="none">
<style>
.steam{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.steam2{animation-delay:.8s}.steam3{animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(14px) scaleY(.8)}40%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scaleY(1.15)}}
.toss{animation:toss 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes toss{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(2deg)}}
.whirl{animation:whirl 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes whirl{0%,100%{transform:translateX(-7px) skewX(-4deg)}50%{transform:translateX(7px) skewX(4deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="4" /></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" /><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0.10 0" /><feComposite in2="SourceGraphic" operator="in" /></filter>
</defs>
<g filter="url(#paper)" stroke="#2b3036" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="320" cy="215" rx="215" ry="74" fill="#e6f2f2" /><ellipse cx="320" cy="212" rx="176" ry="56" fill="#f4fafa" stroke-width="1.6" /><path d="M210 215 C 210 150 430 150 430 215 C 400 245 240 245 210 215Z" fill="#ffffff" /><ellipse cx="272" cy="193" rx="7" ry="2.6" transform="rotate(5 272 193)" fill="#e6ebeb" stroke="none" /><ellipse cx="380" cy="183" rx="7" ry="2.6" transform="rotate(46 380 183)" fill="#e6ebeb" stroke="none" /><ellipse cx="376" cy="216" rx="7" ry="2.6" transform="rotate(2 376 216)" fill="#e6ebeb" stroke="none" /><ellipse cx="288" cy="200" rx="7" ry="2.6" transform="rotate(-18 288 200)" fill="#e6ebeb" stroke="none" /><ellipse cx="282" cy="174" rx="7" ry="2.6" transform="rotate(1 282 174)" fill="#e6ebeb" stroke="none" /><ellipse cx="280" cy="184" rx="7" ry="2.6" transform="rotate(32 280 184)" fill="#e6ebeb" stroke="none" /><ellipse cx="260" cy="206" rx="7" ry="2.6" transform="rotate(-39 260 206)" fill="#e6ebeb" stroke="none" /><ellipse cx="380" cy="208" rx="7" ry="2.6" transform="rotate(29 380 208)" fill="#e6ebeb" stroke="none" /><ellipse cx="254" cy="180" rx="7" ry="2.6" transform="rotate(-18 254 180)" fill="#e6ebeb" stroke="none" /><ellipse cx="340" cy="213" rx="7" ry="2.6" transform="rotate(13 340 213)" fill="#e6ebeb" stroke="none" /><ellipse cx="355" cy="201" rx="7" ry="2.6" transform="rotate(-49 355 201)" fill="#e6ebeb" stroke="none" /><ellipse cx="308" cy="218" rx="7" ry="2.6" transform="rotate(-29 308 218)" fill="#e6ebeb" stroke="none" /><ellipse cx="254" cy="195" rx="7" ry="2.6" transform="rotate(-38 254 195)" fill="#e6ebeb" stroke="none" /><ellipse cx="257" cy="217" rx="7" ry="2.6" transform="rotate(-13 257 217)" fill="#e6ebeb" stroke="none" /><ellipse cx="370" cy="198" rx="7" ry="2.6" transform="rotate(-31 370 198)" fill="#e6ebeb" stroke="none" /><ellipse cx="376" cy="174" rx="7" ry="2.6" transform="rotate(-28 376 174)" fill="#e6ebeb" stroke="none" /><ellipse cx="375" cy="206" rx="7" ry="2.6" transform="rotate(46 375 206)" fill="#e6e