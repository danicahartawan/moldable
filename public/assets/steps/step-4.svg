<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" fill="none">
<style>
.steam{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.steam2{animation-delay:.8s}.steam3{animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(14px) scaleY(.8)}40%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scaleY(1.15)}}
.toss{animation:toss 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes toss{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(2deg)}}
.whirl{animation:whirl 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes whirl{0%,100%{transform:translateX(-7px) skewX(-4deg)}50%{transform:translateX(7px) skewX(4deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0.10 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
</defs>
<g filter="url(#paper)" stroke="#2b3036" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
