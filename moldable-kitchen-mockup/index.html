<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moldable Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400&display=swap">
<style>
/* A product shot you can touch: the display on a wooden kitchen table, a soft window behind, one quiet switch under it. Single warm look. */
:root{
  --ink:#1f1c19; --muted:#6b645a; --glass:rgba(255,251,245,.74); --line:rgba(31,28,25,.12);
  --on:#1f1c19; --onInk:#ffffff; --room:#3a2a1f;
  --sans:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#css{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#css .screen{position:absolute;left:0;top:0;transform-origin:0 0}
.screen{position:relative;width:640px;height:640px;border-radius:40px;overflow:hidden;background:#fff;pointer-events:auto}
.screen .host{position:absolute;inset:0;transition:opacity .45s ease, filter .45s ease}
.screen .host.off{opacity:0;filter:blur(8px);pointer-events:none}
.screen .glare{position:absolute;inset:0;pointer-events:none;border-radius:40px;
  background:linear-gradient(150deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,0) 30%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), inset 0 0 36px rgba(40,24,10,.06)}

.dock{position:fixed;z-index:3;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 32px)}
.hint{margin:0;font-size:13px;line-height:18px;color:var(--muted);text-align:center;text-wrap:balance;background:var(--glass);padding:6px 12px;border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar{display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 10px 30px rgba(20,12,6,.28), 0 0 0 1px var(--line)}
.bar button{height:38px;border:0;border-radius:999px;padding:0 18px;background:transparent;color:var(--ink);font:500 14px/1 var(--sans);cursor:pointer;transition:background-color .2s ease,color .2s ease}
.bar button:hover{background:rgba(31,28,25,.06)}
.bar button[aria-pressed="true"]{background:var(--on);color:var(--onInk)}
.bar button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--room);transition:opacity .7s ease}
.loading p{margin:0;font-family:var(--serif);font-size:22px;color:#e9dccb}
.loading.gone{opacity:0;pointer-events:none}
@media (max-width:520px){.hint{font-size:12px}}
@media (prefers-reduced-motion: reduce){.screen .host{transition:none}}
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="css"></div>

<div class="dock">
  <p class="hint" id="hint">Tap around the screen. The round button by the title shows the steps.</p>
  <div class="bar" role="toolbar" aria-label="Choose a screen">
    <button type="button" id="bHome" aria-pressed="true">Home</button>
    <button type="button" id="bExplore" aria-pressed="false">Explore</button>
  </div>
</div>

<div class="loading" id="loading"><p>Setting the table…</p></div>

<template id="tpl-home"><div style="position: relative; width: 640px; height: 640px; box-sizing: border-box; background: #ffffff; font-family: 'DM Sans', system-ui, sans-serif; color: #1f1c19; overflow: hidden">

  <button type="button" onClick="{{tapVoice}}" aria-label="Wireframe only: play the speaking view. On the device it starts when you talk." style="position: absolute; z-index: 1; left: 0; top: 0; width: 20px; height: 20px; border: 0; padding: 0; background: transparent; cursor: pointer"></button>
  <sc-if value="{{chipsOpen}}" hint-placeholder-val="{{false}}">
    <div class="blurin" role="group" aria-label="Adjust the recipe" style="position: absolute; z-index: 6; left: 20px; bottom: 70px; width: 300px; padding: 8px; box-sizing: border-box; border-radius: 24px; background: rgba(255,255,255,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 12px 32px rgba(31,28,25,.18); display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 4px 10px 2px; font-size: 13px; line-height: 16px; color: #8a8580">Modify</p>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button type="button" class="tap" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 46px; border: 0; border-radius: 16px; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 500 16px/1 'DM Sans', sans-serif; cursor: pointer">{{c.label}}<span style="font-size: 13px; opacity: .7">{{c.hint}}</span></button>
      </sc-for>
      <span aria-hidden="true" style="height: 1px; margin: 4px 10px; background: #efede9"></span>
      <button type="button" class="tap" onClick="{{tapTidy}}" aria-pressed="{{tidy}}" style="height: 46px; border: 0; border-radius: 16px; background: {{tidyBg}}; color: {{tidyInk}}; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 500 16px/1 'DM Sans', sans-serif; cursor: pointer"><span style="display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z M15.5 13l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"></path></svg>Tidy amounts</span><span style="font-size: 13px; opacity: .7">{{tidyHint}}</span></button>
    </div>
  </sc-if>
  <button type="button" class="tap" onClick="{{tapModify}}" aria-expanded="{{chipsOpen}}" style="position: absolute; z-index: 5; left: 20px; bottom: 14px; height: 44px; border: 0; border-radius: 22px; background: {{modBg}}; color: {{modInk}}; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 14px; font: 500 15px/1 'DM Sans', sans-serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6h9M15 6h2M3 14h3M9 14h8"></path><circle cx="13.5" cy="6" r="1.8"></circle><circle cx="7.5" cy="14" r="1.8"></circle></svg>Adjust</button>

  <section aria-label="Recipe overview" style="position: absolute; left: 20px; top: 20px; width: 290px; height: 548px; box-sizing: border-box; border: 1.5px solid #e6e3de; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; padding: 10px">
    <div style="flex: 1; display: flex; flex-direction: column; padding: 14px 10px 6px; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 34px; font-weight: 400">Lelawar Bali</h1>
            <p style="margin: 0; font-size: 14px; line-height: 18px; color: #6b645a">Oma Lien’s recipe</p>
          </div>
          <button type="button" class="tap" onClick="{{toggleSteps}}" aria-pressed="{{isSteps}}" aria-label="{{stAria}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{stBg}}; color: {{stInk}}; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{stIcon}}"></path></svg></button>
        </div>
      </div>
      <sc-if value="{{isOver}}" hint-placeholder-val="{{true}}">
        <img class="blurin" src="assets/lelawar.jpg" alt="Lelawar in a dark bowl on a banana leaf, topped with fried shallots" style="display: block; flex: none; width: 100%; height: 232px; border-radius: 16px; object-fit: cover; object-position: 60% 60%">
      </sc-if>
      <sc-if value="{{isOver}}" hint-placeholder-val="{{true}}">
        <p class="blurin" style="margin: 0; font-size: 16px; line-height: 22px; color: #3d3833">Balinese minced <span class="{{meatCls}}">{{meat}}</span> with toasted coconut, fried in a <span class="{{spiceCls}}">{{paste}}</span> and served on pandan rice.</p>
      </sc-if>
      <sc-if value="{{isSteps}}" hint-placeholder-val="{{false}}">
        <div style="position: relative; height: 438px; margin-top: 4px">
          <ol class="stepscroll" style="height: 100%; overflow-y: auto; margin: 0; padding: 4px 0 90px; box-sizing: border-box; list-style: none; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none">
            <sc-for list="{{simple}}" as="st" hint-placeholder-count="8">
              <li class="blurin" style="display: flex; gap: 12px; align-items: baseline; animation-delay: {{st.dl}}s">
                <span style="flex: none; width: 24px; font-size: 15px; font-weight: 600; color: #8a8580; font-variant-numeric: tabular-nums">{{st.n}}</span>
                <span style="font-size: 18px; line-height: 24px"><sc-for list="{{st.parts}}" as="p" hint-placeholder-count="2"><span class="{{p.cls}}">{{p.t}}</span></sc-for></span>
              </li>
            </sc-for>
          </ol>
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; pointer-events: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); -webkit-mask-image: linear-gradient(180deg, transparent, #000 70%); mask-image: linear-gradient(180deg, transparent, #000 70%); background: linear-gradient(180deg, rgba(255,255,255,0), #ffffff 85%)"></div>
        </div>
      </sc-if>
      <sc-if value="{{isOver}}" hint-placeholder-val="{{true}}">
      <dl class="blurin" style="margin: auto 0 0; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1.5px solid #efede9; padding-top: 12px">
        <div><dt style="font-size: 12px; line-height: 16px; color: #8a8580">Steps</dt><dd style="margin: 2px 0 0; font-size: 22px; line-height: 26px; font-weight: 500">8</dd></div>
        <div><dt style="font-size: 12px; line-height: 16px; color: #8a8580">Serves</dt><dd style="margin: 2px 0 0; font-size: 22px; line-height: 26px; font-weight: 500"><span class="{{servesCls}}">{{serves}}</span></dd></div>
        <div><dt style="font-size: 12px; line-height: 16px; color: #8a8580">Spice</dt><dd style="margin: 2px 0 0; font-size: 22px; line-height: 26px; font-weight: 500"><span class="{{spiceCls}}">{{spice}}</span></dd></div>
      </dl>
      </sc-if>
    </div>
  </section>

  <section aria-label="{{swapAria}}" style="position: absolute; left: 326px; top: 20px; width: 294px; height: 266px; box-sizing: border-box; border: 1.5px solid #e6e3de; border-radius: 24px; overflow: hidden">
    <button type="button" class="tap" onClick="{{swap}}" style="position: absolute; inset: 0; border: 0; background: transparent; color: #1f1c19; cursor: pointer; text-align: left">
      <span class="roll" style="position: absolute; left: 20px; right: 20px; top: 18px; bottom: 20px; display: flex; flex-direction: column; justify-content: space-between; transform: translateY({{timeY}}px); filter: blur({{timeBlur}}px); opacity: {{timeOp}}">
        <span style="font-size: 22px; line-height: 26px; font-weight: 500">Cooking time</span>
        <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 84px; line-height: 80px; font-weight: 500; letter-spacing: -.04em; font-variant-numeric: tabular-nums"><span class="{{timeCls}}">{{mins}}</span></span><span style="font-size: 22px">mins</span></span>
      </span>
      <span class="roll" style="position: absolute; left: 20px; right: 20px; top: 18px; bottom: 20px; display: flex; flex-direction: column; justify-content: space-between; transform: translateY({{toolY}}px); filter: blur({{toolBlur}}px); opacity: {{toolOp}}">
        <span style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 22px; line-height: 26px; font-weight: 500">Tools</span><span style="font-size: 13px; color: #8a8580">5</span></span>
        <span style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 12px">
          <sc-for list="{{tools}}" as="tl" hint-placeholder-count="5">
            <span style="display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 22px; font-weight: 500"><span style="flex: none; width: 36px; height: 36px; border-radius: 12px; background: #f4f3f1; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1c19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tl.d}}"></path></svg></span>{{tl.name}}</span>
          </sc-for>
        </span>
      </span>
    </button>
    <span aria-hidden="true" style="position: absolute; right: 18px; top: 22px; display: flex; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{dot1}}; transition: background-color .3s"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: {{dot2}}; transition: background-color .3s"></span></span>
  </section>

  <section aria-label="Ingredients" style="position: absolute; left: 326px; top: 302px; width: 294px; height: 266px; box-sizing: border-box; border: 1.5px solid #e6e3de; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><p style="margin: 0; font-size: 22px; line-height: 26px; font-weight: 500">Ingredients</p><p style="margin: 0; font-size: 13px; color: #8a8580">11</p></div>
    <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; row-gap: 5px">
      <sc-for list="{{ingr}}" as="g" hint-placeholder-count="11">
        <li style="display: flex; justify-content: space-between; gap: 6px; font-size: 15px; line-height: 21px; white-space: nowrap">
          <span><span class="{{g.cls}}">{{g.name}}</span></span>
          <span style="font-variant-numeric: tabular-nums; color: {{g.amtInk}}"><sc-if value="{{g.raw}}" hint-placeholder-val="{{false}}"><span class="blurin">{{g.rawAmt}}</span></sc-if><sc-if value="{{g.clean}}" hint-placeholder-val="{{true}}"><span class="blurin {{g.acls}}" style="animation-delay: {{g.dl}}s">{{g.amt}}</span></sc-if></span>
        </li>
      </sc-for>
    </ul>
  </section>

  <p style="position: absolute; right: 22px; bottom: 22px; margin: 0; font-size: 22px; line-height: 26px; font-weight: 500">Wave to start</p>

  <sc-if value="{{speaking}}" hint-placeholder-val="{{false}}">
    <div class="veil" role="status" aria-live="polite" style="position: absolute; inset: 0; z-index: 10; background: rgba(255,255,255,.62); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 40px; box-sizing: border-box">
      <span class="orb {{orbCls}}" aria-hidden="true" style="width: 104px; height: 104px; border-radius: 50%; box-shadow: 0 0 48px rgba(236,146,59,.55)"></span>
      <sc-for list="{{voiceLines}}" as="v" hint-placeholder-count="1">
        <sc-if value="{{v.show}}" hint-placeholder-val="{{true}}">
          <div class="blurin" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
            <p style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 500; letter-spacing: -.01em; max-width: 480px">{{v.big}}</p>
            <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6b645a">{{v.small}}</p>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </sc-if>
</div></template>
<template id="tpl-explore"><div data-swipe="explore" style="position: relative; width: 640px; height: 640px; box-sizing: border-box; background: #ffffff; touch-action: pan-y; font-family: 'DM Sans', system-ui, sans-serif; color: #1f1c19; overflow: hidden">

  <div style="position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 50%">
    <div class="{{globeCls}}">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="22">
        <button type="button" class="tile" onClick="{{t.tap}}" tabindex="{{t.tab}}" aria-hidden="{{t.hidden}}" aria-label="{{t.aria}}" style="background: {{t.bg}}; transform: {{t.tf}}; opacity: {{t.op}}; pointer-events: {{t.pe}}">
          <sc-if value="{{t.photo}}" hint-placeholder-val="{{false}}"><img src="assets/lelawar.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 20px"></sc-if>
          <sc-if value="{{t.photo}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5))"></span></sc-if>
          <span style="position: absolute; right: 16px; top: 14px; text-align: right; font-size: 17px; line-height: 20px; font-weight: 500; color: {{t.ink}}">{{t.mins}} mins<br><span style="font-weight: 400">{{t.level}}</span></span>
          <span style="position: absolute; left: 16px; right: 16px; bottom: 14px; font-family: Fraunces, Georgia, serif; font-size: 24px; line-height: 26px; color: {{t.ink}}">{{t.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{showScroll}}" hint-placeholder-val="{{false}}">
    <div class="gscroll" style="position: absolute; inset: 0; z-index: 1; overflow-y: auto; overscroll-behavior: contain">
      <div class="nudge" style="position: relative; height: {{gridH}}px">
        <sc-for list="{{gcards}}" as="g" hint-placeholder-count="8">
          <button type="button" class="tile flat" onClick="{{g.tap}}" aria-label="{{g.aria}}" style="left: {{g.l}}px; top: {{g.t}}px; background: {{g.bg}}">
            <sc-if value="{{g.photo}}" hint-placeholder-val="{{false}}"><img src="assets/lelawar.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 20px"></sc-if>
            <sc-if value="{{g.photo}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5))"></span></sc-if>
            <span style="position: absolute; right: 16px; top: 14px; text-align: right; font-size: 17px; line-height: 20px; font-weight: 500; color: {{g.ink}}">{{g.mins}} mins<br><span style="font-weight: 400">{{g.level}}</span></span>
            <span style="position: absolute; left: 16px; right: 16px; bottom: 14px; font-family: Fraunces, Georgia, serif; font-size: 24px; line-height: 26px; color: {{g.ink}}">{{g.name}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
  <div aria-hidden="true" style="position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 120px; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); backdrop-filter: blur(12px) saturate(1.1); -webkit-backdrop-filter: blur(12px) saturate(1.1); -webkit-mask-image: linear-gradient(180deg, #000 35%, transparent); mask-image: linear-gradient(180deg, #000 35%, transparent)"></div>
  <div aria-hidden="true" style="position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 110px; pointer-events: none; background: linear-gradient(0deg, rgba(255,255,255,.35), rgba(255,255,255,0)); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); -webkit-mask-image: linear-gradient(0deg, #000 35%, transparent); mask-image: linear-gradient(0deg, #000 35%, transparent)"></div>
  </sc-if>

  <div role="group" aria-label="Cookbooks, swipe left or right to switch" style="position: absolute; z-index: 4; left: 0; right: 0; top: 12px; height: 44px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent)">
    <sc-for list="{{titles}}" as="bt" hint-placeholder-count="4">
      <button type="button" class="tap" onClick="{{bt.tap}}" aria-current="{{bt.cur}}" aria-label="{{bt.aria}}" tabindex="{{bt.tab}}" style="position: absolute; left: 50%; top: 0; height: 44px; border: 0; padding: 0 10px; background: transparent; display: inline-flex; align-items: baseline; gap: 10px; white-space: nowrap; cursor: pointer; color: #1f1c19; transform: translateX(calc(-50% + {{bt.x}}px)) scale({{bt.s}}); opacity: {{bt.op}}; filter: blur({{bt.bl}}px); transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s ease, filter .4s ease"><span style="font-family: Fraunces, Georgia, serif; font-size: 22px; line-height: 44px">{{bt.label}}</span><span style="font: 400 14px/1 'DM Sans', sans-serif; color: #8a8580; opacity: {{bt.cop}}">{{bt.count}}</span></button>
    </sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; z-index: 4; left: 0; right: 0; top: 58px; display: flex; justify-content: center; gap: 6px; pointer-events: none">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
      <span style="width: {{d.w}}px; height: 6px; border-radius: 3px; background: {{d.c}}; transition: width .35s cubic-bezier(.2,.8,.2,1), background-color .35s ease"></span>
    </sc-for>
  </div>

  <sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
    <button type="button" class="tap blurin" onClick="{{toGlobe}}" style="position: absolute; z-index: 3; right: 20px; bottom: 18px; height: 44px; border: 0; border-radius: 22px; background: #f4f3f1; padding: 0 18px 0 14px; display: inline-flex; align-items: center; gap: 8px; font: 500 15px/1 'DM Sans', sans-serif; color: #1f1c19; cursor: pointer"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="M3 10h14M10 3c2.5 2 2.5 12 0 14M10 3c-2.5 2-2.5 12 0 14"></path></svg>Back to globe</button>
  </sc-if>
