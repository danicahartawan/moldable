<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weigh on the board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes blurin{from{opacity:0;filter:blur(6px);transform:translateY(4px)}to{opacity:1;filter:none;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes menuin{from{opacity:0;transform:translateY(-6px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardin{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.blurin{animation:blurin .36s cubic-bezier(.2,.8,.2,1) both}
.drawcheck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .42s cubic-bezier(.2,.8,.2,1) .1s forwards}
.pop{animation:pop .42s cubic-bezier(.3,1.4,.5,1) both}
.menu{animation:menuin .22s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.card{animation:cardin .38s cubic-bezier(.3,1.2,.5,1) both}
.press{transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .24s ease}
.press:active{transform:scale(.96)}
.day{transition:background-color .28s cubic-bezier(.2,.8,.2,1),color .28s ease,transform .14s cubic-bezier(.2,.8,.2,1)}
.day:active{transform:scale(.94)}
.day:hover .dot{transform:scale(1.15)}
.dot{transition:transform .2s cubic-bezier(.3,1.4,.5,1),background-color .28s ease,border-color .28s ease}
.seg button svg{transition:color .24s ease,transform .24s cubic-bezier(.3,1.4,.5,1)}
.seg button:hover svg{color:#4e0b91;transform:scale(1.12)}
.rcol{display:inline-block;height:1em;line-height:1em;overflow:hidden;vertical-align:top}
.rstrip{display:block;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.rstrip span{display:block;height:1em}
.ring{transition:stroke .3s ease}
@media (prefers-reduced-motion: reduce){.blurin,.pop,.menu,.card{animation:none}.drawcheck path{animation:none;stroke-dashoffset:0}.rstrip,.day,.dot{transition:none}}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; padding: 40px; background: #e8e5de; font-family: ABC Arizona Sans, system-ui, sans-serif; color: #1f1c19">
  <div style="width: 1360px; height: 880px; box-sizing: border-box; border-radius: 0; background: #f2efe9; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 30px 70px rgba(31,28,25,.12); padding: 26px; display: flex; flex-direction: column; gap: 26px">

    <header style="position: relative; z-index: 3; height: 92px; flex: none; box-sizing: border-box; border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07); display: flex; align-items: center; gap: 16px; padding: 0 16px 0 30px">
      <img src="../assets/moldable-logo.png" alt="Moldable" style="height: 26px; width: auto; flex: none">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <p style="margin: 0; font-size: 14px; line-height: 18px; color: #6b645a">Step 1 of 8, soto ayam</p>
        <p style="margin: 0; font-size: 24px; line-height: 28px; font-weight: 500; letter-spacing: -.01em">{{headline}}</p>
      </div>
      <div style="position: relative">
        <button type="button" class="press" onClick="{{toggleMenu}}" aria-haspopup="menu" aria-expanded="{{menuOpen}}" style="height: 52px; border: 0; border-radius: 0; background: {{menuBtnBg}}; padding: 0 16px 0 18px; display: flex; align-items: center; gap: 8px; cursor: pointer; font: 500 16px/1 ABC Arizona Sans, sans-serif; color: #1f1c19">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h14M5 15l1.5-8h7L15 15"></path><path d="M10 7V4.5"></path></svg>
          Scale
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chev}}deg); transition: transform .24s cubic-bezier(.3,1.4,.5,1)"><path d="M6 8l4 4 4-4"></path></svg>
        </button>
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
          <div class="menu" role="menu" onMouseLeave="{{menuLeave}}" style="position: absolute; right: 0; top: 60px; width: 240px; padding: 6px; border-radius: 0; background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); box-shadow: 0 0 0 1px rgba(31,28,25,.08), 0 18px 44px rgba(31,28,25,.18)">
            <span aria-hidden="true" style="position: absolute; left: 6px; right: 6px; top: 6px; height: 44px; border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 2px 6px rgba(31,28,25,.08); transform: translateY({{hiY}}px); opacity: {{hiO}}; transition: transform .22s cubic-bezier(.3,1.2,.5,1), opacity .18s ease"></span>
            <sc-for list="{{menu}}" as="m" hint-placeholder-count="3">
              <button type="button" role="menuitem" onMouseEnter="{{m.hover}}" onClick="{{m.pick}}" style="position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; border: 0; background: transparent; padding: 0 12px; font: {{m.weight}} 15px/1 ABC Arizona Sans, sans-serif; color: #1f1c19; cursor: pointer; text-align: left">
                <span style="flex: 1">{{m.label}}</span>
                <span style="font-size: 12px; color: #8c8376">{{m.hint}}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <button type="button" class="press" style="height: 60px; border: 0; border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07); display: flex; align-items: center; gap: 10px; padding: 0 26px 0 20px; cursor: pointer; font: 500 18px/1 ABC Arizona Sans, sans-serif; color: #1f1c19">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 3a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-5 0v-4A2.5 2.5 0 0 1 10 3z"></path><path d="M5.5 9.5a4.5 4.5 0 0 0 9 0M10 14v3"></path></svg>
        Hold to ask
      </button>
    </header>

    <main style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 28px; padding: 0 20px 0 22px">
      <section aria-label="Scale" style="position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
        <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6b645a">{{placeHint}}</p>
        <div style="position: relative; width: 560px; height: 560px">
          <div style="position: absolute; inset: 40px; border-radius: 50%; background: #e9e4da"></div>
          <svg width="560" height="560" viewBox="0 0 560 560" fill="none" role="img" aria-label="{{ariaWeight}}" style="position: absolute; inset: 0">
            <circle cx="280" cy="280" r="262" stroke="#ddd7cc" stroke-width="8"></circle>
            <circle class="ring" cx="280" cy="280" r="262" stroke="{{ringGlow}}" stroke-width="18" opacity=".22" pathLength="100" stroke-dasharray="{{dash}}" transform="rotate(-90 280 280)" stroke-linecap="round"></circle>
            <circle class="ring" cx="280" cy="280" r="262" stroke="{{ringColor}}" stroke-width="8" pathLength="100" stroke-dasharray="{{dash}}" transform="rotate(-90 280 280)" stroke-linecap="round"></circle>
            <path d="M280 10v14" stroke="#1f1c19" stroke-width="2"></path>
            <ellipse cx="280" cy="280" rx="170" ry="170" stroke="#1f1c19" stroke-width="1.3" stroke-dasharray="3 6"></ellipse>
            <ellipse cx="280" cy="280" rx="132" ry="132" stroke="#1f1c19" stroke-width="1.3"></ellipse>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
            <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6b645a">{{itemName}}</p>
            <sc-if value="{{grams}}" hint-placeholder-val="{{true}}">
              <p class="blurin" aria-hidden="true" style="margin: 0; font-size: 104px; line-height: 104px; font-weight: 500; letter-spacing: -.045em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline">
                <sc-for list="{{digits}}" as="d" hint-placeholder-count="4">
                  <sc-if value="{{d.isDigit}}" hint-placeholder-val="{{true}}"><span class="rcol"><span class="rstrip" style="transform: translateY({{d.y}}%); transition-delay: {{d.delay}}ms"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span></span></sc-if>
                  <sc-if value="{{d.isSep}}" hint-placeholder-val="{{false}}"><span style="color: #b5ada1">,</span></sc-if>
                </sc-for>
                <span style="font-size: 36px; font-weight: 400; letter-spacing: 0; margin-left: 10px; color: #6b645a">g</span>
              </p>
            </sc-if>
            <sc-if value="{{cups}}" hint-placeholder-val="{{false}}">
              <p class="blurin" style="margin: 0; font-size: 104px; line-height: 104px; font-weight: 500; letter-spacing: -.045em">{{cupText}}<span style="font-size: 36px; font-weight: 400; letter-spacing: 0; margin-left: 10px; color: #6b645a">cups</span></p>
            </sc-if>
            <sc-if value="{{pouring}}" hint-placeholder-val="{{true}}">
              <p style="margin: 0; font-size: 18px; line-height: 24px; color: #6b645a">{{targetText}}, <b style="color: #8a4300; font-weight: 500">{{leftText}}</b></p>
            </sc-if>
            <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
              <p class="pop" style="margin: 0; height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; border-radius: 0; background: #e2f1e3; color: #2c6a39; font-size: 17px; font-weight: 500">
                <svg class="drawcheck" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path pathLength="1" d="M5 10.5l3.2 3.2L15 6.8"></path></svg>
                Right on target
              </p>
            </sc-if>
          </div>
        </div>
      </section>

      <aside style="display: flex; flex-direction: column; gap: 18px; min-width: 0">
        <div class="seg" role="group" aria-label="Units" style="position: relative; align-self: flex-start; display: grid; grid-template-columns: 140px 140px; padding: 4px; border-radius: 0; background: #e9e4da">
          <span aria-hidden="true" style="position: absolute; top: 4px; left: 4px; width: 140px; height: 44px; border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 2px 6px rgba(31,28,25,.08); transform: translateX({{pillX}}px); transition: transform .32s cubic-bezier(.3,1.3,.5,1)"></span>
          <button type="button" aria-pressed="{{grams}}" onClick="{{toGrams}}" style="position: relative; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 15px/1 ABC Arizona Sans, sans-serif; color: {{gColor}}; cursor: pointer; transition: color .24s ease">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="{{gIcon}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h14M5 15l1.5-8h7L15 15"></path><path d="M10 7V4.5"></path></svg>
            Grams
          </button>
          <button type="button" aria-pressed="{{cups}}" onClick="{{toCups}}" style="position: relative; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 15px/1 ABC Arizona Sans, sans-serif; color: {{cColor}}; cursor: pointer; transition: color .24s ease">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="{{cIcon}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M14 8h1.5a2 2 0 0 1 0 4H14"></path></svg>
            Her cups
          </button>
        </div>

        <div style="border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07); padding: 18px 16px 16px">
          <p style="margin: 0 4px 12px; font-size: 15px; line-height: 20px; color: #6b645a">You've weighed <b style="color: #1f1c19; font-weight: 500">{{doneCount}} of 7</b> for this soto</p>
          <div role="radiogroup" aria-label="Ingredients to weigh" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 6px; border-radius: 0; background: #f2efe9">
            <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
              <button type="button" class="day" role="radio" aria-checked="{{it.sel}}" aria-label="{{it.name}}" onClick="{{it.pick}}" style="height: 74px; border: 0; border-radius: 0; background: {{it.bg}}; color: {{it.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 0">
                <span style="font: 500 13px/1 ABC Arizona Sans, sans-serif">{{it.short}}</span>
                <span class="dot" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: {{it.dot}}; border: 1.5px solid {{it.ring}}; display: grid; place-items: center">
                  <sc-if value="{{it.done}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 6.8"></path></svg></sc-if>
                </span>
              </button>
            </sc-for>
          </div>
        </div>

        <sc-for list="{{cardList}}" as="c" hint-placeholder-count="7">
          <sc-if value="{{c.show}}" hint-placeholder-val="{{false}}"><div class="card" style="border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07); padding: 16px 18px; display: flex; align-items: center; gap: 14px">
            <span style="width: 44px; height: 44px; border-radius: 0; background: {{c.tile}}; color: {{c.tileFg}}; display: grid; place-items: center; flex: none">
              <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
            </span>
            <div style="flex: 1; min-width: 0">
              <p style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 500">{{c.name}}</p>
              <p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #6b645a">{{c.note}}</p>
            </div>
            <div style="text-align: right">
              <p style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums">{{c.amount}}</p>
              <p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: {{c.stateColor}}">{{c.state}}</p>
            </div>
          </div></sc-if>
        </sc-for>

        <button type="button" class="press" onClick="{{advance}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: auto; height: 60px; border: 0; border-radius: 0; background: {{nextBg}}; color: #ffffff; font: 500 17px/1 ABC Arizona Sans, sans-serif; cursor: pointer; box-shadow: 0 1px 2px rgba(31,28,25,.18); transition: background-color .3s ease">Done, next step<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4"></path></svg></button>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
var PER_CUP = 240;
var FR = [[0, ''], [0.25, '¼'], [1 / 3, '⅓'], [0.5, '½'], [2 / 3, '⅔'], [0.75, '¾'], [1, '']];
function cupsOf(g) {
  var n = g / PER_CUP, w = Math.floor(n), rem = n - w, b = FR[0];
  FR.forEach(function (f) { if (Math.abs(f[0] - rem) < Math.abs(b[0] - rem)) b = f; });
  if (b[0] === 1) { w += 1; b = FR[0]; }
  return ((w ? String(w) : '') + b[1]) || '0';
}
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
var ICON = {
  drop: 'M10 3c3 4 5 6.5 5 9a5 5 0 0 1-10 0c0-2.5 2-5 5-9z',
  leg: 'M7 4a4 4 0 0 1 6 5l-5 6a1.6 1.6 0 1 1-2-2l-1 1a1.4 1.4 0 1 1-1-2.4L6 9A4 4 0 0 1 7 4z',
  bulb: 'M10 4c3 2 5 5 5 8a5 4 0 0 1-10 0c0-3 2-6 5-8zM10 4V2',
  clove: 'M10 4c2 3 4 6 4 9a4 3 0 0 1-8 0c0-3 2-6 4-9z',
  nut: 'M10 4a6 6 0 1 1 0 12a6 6 0 1 1 0-12zM8 9h.01M12 11h.01',
  root: 'M3 12c2-3 7-3 9-1 2-2 5-1 5 1s-3 3-5 2c-3 2-7 2-9-2z',
  noodle: 'M3 7c2-3 4 3 7 0s5 3 7 0M3 11c2-3 4 3 7 0s5 3 7 0M3 15c2-3 4 3 7 0s5 3 7 0'
};
var ITEMS = [
  { name: 'Chicken', short: 'Chkn', target: 1200, icon: 'leg', note: 'Whole, rinsed' },
  { name: 'Water', short: 'Water', target: 2000, icon: 'drop', note: 'For the broth, 2 litres' },
  { name: 'Shallots', short: 'Shal', target: 120, icon: 'bulb', note: '8 shallots, peeled' },
  { name: 'Garlic', short: 'Garl', target: 30, icon: 'clove', note: '5 cloves' },
  { name: 'Candlenuts', short: 'Nuts', target: 24, icon: 'nut', note: '3 candlenuts, toasted' },
  { name: 'Turmeric', short: 'Turm', target: 20, icon: 'root', note: '4 cm piece' },
  { name: 'Glass noodles', short: 'Ndl', target: 100, icon: 'noodle', note: 'Soak after weighing' }
];
var MENU = [{ label: 'Zero the scale', hint: 'Tare', act: 'zero' }, { label: 'Pour again', hint: 'Reset', act: 'again' }, { label: 'Pause weighing', hint: 'Hold', act: 'pause' }];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { live: 1, sel: 1, g: 0, unit: 'g', pause: 900, menu: false, hi: -1, held: false }; }
  componentDidMount() {
    this.tick = setInterval(() => {
      var s = this.state, T = ITEMS[s.live].target;
      if (s.held) return;
      if (s.pause > 0) { this.setState({ pause: s.pause - 80 }); return; }
      if (s.g >= T) return;
      var g = s.g + Math.max(4, (T - s.g) * 0.04) + Math.random() * 8;
      this.setState({ g: Math.min(T, g) });
    }, 80);
  }
  componentWillUnmount() { clearInterval(this.tick); }
  renderVals() {
    var s = this.state, it = ITEMS[s.live], T = it.target, g = Math.round(s.g), done = g >= T, frac = Math.min(1, s.g / T);
    var str = fmt(g);
    var stateOf = (i) => i < s.live || (i === s.live && done) ? 'done' : i === s.live ? 'live' : 'next';
    var doneCount = ITEMS.filter((_, i) => stateOf(i) === 'done').length;
    var hint = done ? 'Stop pouring. Pick the next ingredient below.' : s.held ? 'Weighing paused.' : s.pause > 0 ? 'Bowl found. Start pouring.' : 'Pour slowly. The ring closes at ' + fmt(T) + ' g.';
    return {
      headline: done ? it.name + ' weighed' : 'Pour in the ' + it.name.toLowerCase(),
      placeHint: hint, itemName: it.name,
      digits: str.split('').map((c, i) => ({ isDigit: c !== ',', isSep: c === ',', y: c === ',' ? 0 : -(+c) * 10, delay: i * 40 })),
      grams: s.unit === 'g', cups: s.unit === 'cups', cupText: cupsOf(s.g),
      pouring: !done, done: done,
      dash: (frac * 100).toFixed(2) + ' 100',
      ringColor: done ? '#2c6a39' : ['#4e0b91', '#b4347c', '#ec923b', '#e8c23a'][Math.min(3, Math.floor(frac * 4))],
      ringGlow: done ? '#86d095' : ['#4e0b91', '#b4347c', '#ec923b', '#f5d653'][Math.min(3, Math.floor(frac * 4))],
      ariaWeight: g + ' of ' + T + ' grams of ' + it.name.toLowerCase(),
      targetText: s.unit === 'g' ? 'of ' + fmt(T) + ' g' : 'of ' + cupsOf(T) + ' cups',
      leftText: fmt(T - g) + ' g to go',
      pillX: s.unit === 'g' ? 0 : 140,
      gColor: s.unit === 'g' ? '#1f1c19' : '#6b645a', cColor: s.unit === 'cups' ? '#1f1c19' : '#6b645a',
      gIcon: s.unit === 'g' ? '#4e0b91' : 'currentColor', cIcon: s.unit === 'cups' ? '#4e0b91' : 'currentColor',
      toGrams: () => this.setState({ unit: 'g' }), toCups: () => this.setState({ unit: 'cups' }),
      doneCount: doneCount,
      items: ITEMS.map((x, i) => {
        var k = stateOf(i), sel = i === s.sel;
        return {
          name: x.name, short: x.short, sel: sel, done: k === 'done',
          bg: sel ? '#1f1c19' : 'transparent', fg: sel ? '#ffffff' : '#1f1c19',
          dot: k === 'done' ? '#2c6a39' : k === 'live' ? '#ec923b' : 'transparent',
          ring: k === 'done' ? '#2c6a39' : k === 'live' ? '#ec923b' : (sel ? '#8c8376' : '#b5ada1'),
          pick: () => { if (done && i === s.live + 1) this.setState({ sel: i, live: i, g: 0, pause: 900 }); else this.setState({ sel: i }); }
        };
      }),
      cardList: ITEMS.map((shown, i) => { var st = stateOf(i); return {
        show: i === s.sel, name: shown.name, note: shown.note, icon: ICON[shown.icon],
        tile: st === 'done' ? '#e2f1e3' : st === 'live' ? '#fdf4cf' : '#ece3f6',
        tileFg: st === 'done' ? '#2c6a39' : st === 'live' ? '#8a4300' : '#4e0b91',
        amount: st === 'live' ? fmt(g) + ' / ' + fmt(shown.target) + ' g' : fmt(shown.target) + ' g',
        state: st === 'done' ? 'Weighed' : st === 'live' ? 'On the scale now' : 'Up next',
        stateColor: st === 'done' ? '#2c6a39' : st === 'live' ? '#8a4300' : '#6b645a'
      }; }),
      advance: () => { if (done && s.live < ITEMS.length - 1) this.setState({ live: s.live + 1, sel: s.live + 1, g: 0, pause: 900 }); },
      nextBg: done ? '#4e0b91' : '#a993c7',
      menuOpen: s.menu, chev: s.menu ? 180 : 0, menuBtnBg: s.menu ? '#e9e4da' : '#ece7de',
      toggleMenu: () => this.setState({ menu: !s.menu, hi: -1 }),
      menuLeave: () => this.setState({ hi: -1 }),
      hiY: Math.max(0, s.hi) * 44, hiO: s.hi < 0 ? 0 : 1,
      menu: MENU.map((m, i) => ({
        label: s.held && m.act === 'pause' ? 'Resume weighing' : m.label, hint: m.hint, weight: i === s.hi ? 500 : 400,
        hover: () => this.setState({ hi: i }),
        pick: () => {
          if (m.act === 'zero' || m.act === 'again') this.setState({ g: 0, pause: 900, menu: false, held: false });
          else this.setState({ held: !s.held, menu: false });
        }
      }))
    };
  }
}
</script>
</body>
</html>
