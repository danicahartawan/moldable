<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe on the board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.up{}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes blurin{from{opacity:0;filter:blur(6px);transform:translateY(3px)}to{opacity:1;filter:none;transform:none}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}
.drawing [pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.2,.8,.2,1) forwards}
.drawing .g2 [pathLength]{animation-delay:.2s}.drawing .g3 [pathLength]{animation-delay:.4s}.drawing .g4 [pathLength]{animation-delay:.6s}.drawing .g5 [pathLength]{animation-delay:.8s}
.drawing .fade{opacity:0;animation:fadein .8s ease 1.1s forwards}
.drawing g{transition:opacity .42s cubic-bezier(.2,.8,.2,1),stroke .3s ease}
.drawing text{transition:opacity .42s cubic-bezier(.2,.8,.2,1)}
.peek{opacity:.28;transition:opacity .24s ease,background-color .24s ease}.stepzone:hover .peek,.peek:focus-visible,.peek[aria-pressed="true"]{opacity:1}.peek:hover{background:#ece7de}.peek-label{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .32s cubic-bezier(.2,.8,.2,1)}.stepzone:hover .peek-label,.peek[aria-pressed="true"] .peek-label{max-width:120px}
.blurin{animation:blurin .36s cubic-bezier(.2,.8,.2,1) both}
.row{transition:transform .56s cubic-bezier(.3,1.2,.5,1),opacity .42s ease,filter .42s ease,font-size .42s ease}
.tab{transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease,background-color .24s ease}
.tab:active{transform:scale(.95)}
.press{transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease}
.press:active{transform:scale(.96)}
.dots circle{animation:dot .9s cubic-bezier(.65,0,.35,1) infinite}
.recdot{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.drawing [pathLength]{animation:none;stroke-dashoffset:0}.drawing .fade{animation:none;opacity:1}.blurin,.recdot,.dots circle{animation:none}.row{transition:none}}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; padding: 40px; background: #e8e5de; font-family: ABC Arizona Sans, system-ui, sans-serif; color: #1f1c19">
  <div style="width: 1360px; height: 880px; box-sizing: border-box; border-radius: 0; background: #f2efe9; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 30px 70px rgba(31,28,25,.12); padding: 26px; display: flex; flex-direction: column; gap: 26px">

    <header style="height: 92px; flex: none; box-sizing: border-box; border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07); display: flex; align-items: center; gap: 20px; padding: 0 16px 0 30px">
      <img src="../assets/moldable-logo.png" alt="Moldable" style="height: 26px; width: auto; flex: none">
      <nav aria-label="Recipes" style="flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <button type="button" class="tab" aria-pressed="{{t.active}}" aria-label="{{t.name}}" onClick="{{t.pick}}" style="height: {{t.h}}px; min-width: 64px; border: 0; border-radius: 0; background: {{t.bg}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 {{t.padR}}px 0 {{t.padL}}px; cursor: pointer; font: 600 16px/1 ABC Arizona Sans, sans-serif; color: #1f1c19">
            <sc-if value="{{t.k0}}" hint-placeholder-val="{{false}}"><svg width="34" height="24" viewBox="0 0 34 24" fill="none" stroke="{{t.ink}}" stroke-width="1.3" aria-hidden="true"><circle cx="9" cy="14" r="7"></circle><circle cx="25" cy="14" r="7"></circle><circle cx="17" cy="9" r="7"></circle></svg></sc-if>
            <sc-if value="{{t.k1}}" hint-placeholder-val="{{false}}"><svg width="34" height="26" viewBox="0 0 34 26" fill="none" stroke="{{t.ink}}" stroke-width="1.4" aria-hidden="true"><path d="M3 11h28a14 12 0 0 1-28 0z"></path><path d="M12 7c1-2 3-1 4-4M19 7c1-2 3-1 4-4"></path></svg></sc-if>
            <sc-if value="{{t.k2}}" hint-placeholder-val="{{false}}"><svg width="34" height="24" viewBox="0 0 34 24" fill="none" stroke="{{t.ink}}" stroke-width="1.3" aria-hidden="true"><path d="M4 10h26M6 10v9a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3v-9"></path><path d="M12 6l1-3M21 6l1-3"></path></svg></sc-if>
            <sc-if value="{{t.k3}}" hint-placeholder-val="{{false}}"><svg width="34" height="24" viewBox="0 0 34 24" fill="none" stroke="{{t.ink}}" stroke-width="1.3" aria-hidden="true"><rect x="6" y="4" width="22" height="16" rx="2"></rect><path d="M6 8h22M6 12h22M6 16h22"></path></svg></sc-if>
            <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}"><span class="blurin" style="white-space: nowrap">{{t.name}}</span></sc-if>
          </button>
        </sc-for>
        <button type="button" class="tab" aria-label="Add a recipe" style="width: 52px; height: 52px; border: 1.5px dashed #b5ada1; border-radius: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: #6b645a">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"></path></svg>
        </button>
      </nav>
      <button type="button" class="press" aria-label="Scan a recipe card" style="width: 48px; height: 48px; border: 0; border-radius: 0; background: #ece7de; box-shadow: none; display: grid; place-items: center; cursor: pointer; color: #1f1c19">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 7V3.5H7M13 3.5h3.5V7M16.5 13v3.5H13M7 16.5H3.5V13"></path></svg>
      </button>
      <button type="button" class="press" aria-label="Ask about this recipe" style="width: 48px; height: 48px; border: 0; border-radius: 0; background: #ece7de; box-shadow: none; display: grid; place-items: center; cursor: pointer; color: #1f1c19">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5h12v8.5H9l-3.5 3v-3H4z"></path></svg>
      </button>
      <button type="button" class="press" onClick="{{toggleRec}}" aria-pressed="{{recOn}}" style="height: 60px; min-width: 176px; border: 0; border-radius: 0; background: #ffffff; box-shadow: 0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 26px 0 22px; cursor: pointer; font: 500 18px/1 ABC Arizona Sans, sans-serif; color: #1f1c19">
        <sc-if value="{{recIdle}}" hint-placeholder-val="{{true}}">
          <span class="blurin" style="display: inline-flex; align-items: center; gap: 10px">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 3a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-5 0v-4A2.5 2.5 0 0 1 10 3z"></path><path d="M5.5 9.5a4.5 4.5 0 0 0 9 0M10 14v3"></path></svg>
            Record
          </span>
        </sc-if>
        <sc-if value="{{recStarting}}" hint-placeholder-val="{{false}}">
          <span class="blurin" style="display: inline-flex; align-items: center; gap: 10px">
            <svg class="dots" width="20" height="20" viewBox="0 0 20 20" fill="#1f1c19" aria-hidden="true"><circle cx="4" cy="4" r="1.4"></circle><circle cx="10" cy="4" r="1.4" style="animation-delay:.09s"></circle><circle cx="16" cy="4" r="1.4" style="animation-delay:.18s"></circle><circle cx="4" cy="10" r="1.4" style="animation-delay:.09s"></circle><circle cx="10" cy="10" r="1.4" style="animation-delay:.18s"></circle><circle cx="16" cy="10" r="1.4" style="animation-delay:.27s"></circle><circle cx="4" cy="16" r="1.4" style="animation-delay:.18s"></circle><circle cx="10" cy="16" r="1.4" style="animation-delay:.27s"></circle><circle cx="16" cy="16" r="1.4" style="animation-delay:.36s"></circle></svg>
            Starting
          </span>
        </sc-if>
        <sc-if value="{{recOn}}" hint-placeholder-val="{{false}}">
          <span class="blurin" style="display: inline-flex; align-items: center; gap: 10px">
            <span class="recdot" style="width: 12px; height: 12px; border-radius: 50%; background: #b0302a"></span>
            <span style="font-variant-numeric: tabular-nums">{{recTime}}</span>
          </span>
        </sc-if>
      </button>
    </header>

    <main style="position: relative; flex: 1; min-height: 0">
      <svg class="drawing" width="1308" height="710" viewBox="0 0 1308 710" fill="none" stroke="#1f1c19" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Line drawing of every soto ayam ingredient laid out across the board, around the serving bowl" style="position: absolute; inset: 0">
        <g class="g1" stroke="{{hl.pot.c}}" stroke-width="{{hl.pot.w}}" opacity="{{hl.pot.o}}">
          <circle pathLength="1" cx="640" cy="410" r="118"></circle>
          <circle pathLength="1" cx="640" cy="410" r="100"></circle>
          <circle class="fade" cx="640" cy="410" r="82" stroke-dasharray="2 6"></circle>
          <path pathLength="1" d="M760 410h46M778 398v24"></path>
        </g>
        <g class="g1" stroke="{{hl.chicken.c}}" stroke-width="{{hl.chicken.w}}" opacity="{{hl.chicken.o}}">
          <path pathLength="1" d="M120 250c0-40 36-66 72-56 30 8 48 40 38 70-6 18-22 30-40 34l-38 60c-4 8-14 10-20 4-6-6-4-16 4-20l14-10c-20-18-30-44-30-82z"></path>
          <path pathLength="1" d="M250 300c10-38 50-54 82-38 28 14 36 50 20 76-10 16-28 24-46 22l-52 48c-6 6-16 6-20-2-4-6 0-16 8-18l16-6c-12-24-14-52-8-82z"></path>
        </g>
        <g class="g2" stroke="{{hl.shallot.c}}" stroke-width="{{hl.shallot.w}}" opacity="{{hl.shallot.o}}">
          <g transform="translate(110 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(146 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(182 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(218 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(254 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(290 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(326 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
          <g transform="translate(362 470)"><ellipse pathLength="1" rx="11" ry="15"></ellipse><path pathLength="1" d="M0 -15v-7"></path></g>
        </g>
        <g class="g2" stroke="{{hl.garlic.c}}" stroke-width="{{hl.garlic.w}}" opacity="{{hl.garlic.o}}">
          <path pathLength="1" d="M110 560c0-16 10-26 18-30 8 4 18 14 18 30 0 10-8 16-18 16s-18-6-18-16z"></path>
          <path pathLength="1" d="M160 560c0-16 10-26 18-30 8 4 18 14 18 30 0 10-8 16-18 16s-18-6-18-16z"></path>
          <path pathLength="1" d="M210 560c0-16 10-26 18-30 8 4 18 14 18 30 0 10-8 16-18 16s-18-6-18-16z"></path>
          <path pathLength="1" d="M260 560c0-16 10-26 18-30 8 4 18 14 18 30 0 10-8 16-18 16s-18-6-18-16z"></path>
          <path pathLength="1" d="M310 560c0-16 10-26 18-30 8 4 18 14 18 30 0 10-8 16-18 16s-18-6-18-16z"></path>
        </g>
        <g class="g3" stroke="{{hl.nut.c}}" stroke-width="{{hl.nut.w}}" opacity="{{hl.nut.o}}">
          <circle pathLength="1" cx="124" cy="640" r="14"></circle><circle pathLength="1" cx="162" cy="640" r="14"></circle><circle pathLength="1" cx="200" cy="640" r="14"></circle>
        </g>
        <g class="g3" stroke="{{hl.turmeric.c}}" stroke-width="{{hl.turmeric.w}}" opacity="{{hl.turmeric.o}}">
          <path pathLength="1" d="M260 650c10-14 40-14 60-6 14-10 34-8 40 4 6 12-4 24-20 22-14 10-44 10-62 2-14 2-24-10-18-22z"></path>
          <path pathLength="1" d="M300 646l-6-14M330 652l6-12"></path>
        </g>
        <g class="g4" stroke="{{hl.noodle.c}}" stroke-width="{{hl.noodle.w}}" opacity="{{hl.noodle.o}}">
          <path pathLength="1" d="M440 620c30-30 60 30 90 0s60 30 90 0 60 30 90 0"></path>
          <path pathLength="1" d="M440 640c30-30 60 30 90 0s60 30 90 0 60 30 90 0"></path>
          <path pathLength="1" d="M440 660c30-30 60 30 90 0s60 30 90 0 60 30 90 0"></path>
        </g>
        <g class="g4" stroke="{{hl.sprout.c}}" stroke-width="{{hl.sprout.w}}" opacity="{{hl.sprout.o}}">
          <path pathLength="1" d="M790 630c10 20 30 30 50 26"></path><circle pathLength="1" cx="786" cy="624" r="6"></circle>
          <path pathLength="1" d="M830 620c14 18 34 24 54 18"></path><circle pathLength="1" cx="826" cy="614" r="6"></circle>
          <path pathLength="1" d="M800 664c14 14 36 18 54 10"></path><circle pathLength="1" cx="796" cy="658" r="6"></circle>
          <path pathLength="1" d="M870 650c12 16 30 22 48 16"></path><circle pathLength="1" cx="866" cy="644" r="6"></circle>
        </g>
        <g class="g5" stroke="{{hl.egg.c}}" stroke-width="{{hl.egg.w}}" opacity="{{hl.egg.o}}">
          <g transform="translate(1010 500)"><ellipse pathLength="1" rx="30" ry="40"></ellipse><circle pathLength="1" cy="6" r="15"></circle></g>
          <g transform="translate(1090 500)"><ellipse pathLength="1" rx="30" ry="40"></ellipse><circle pathLength="1" cy="6" r="15"></circle></g>
          <g transform="translate(1170 500)"><ellipse pathLength="1" rx="30" ry="40"></ellipse><circle pathLength="1" cy="6" r="15"></circle></g>
        </g>
        <g class="g5" stroke="{{hl.grass.c}}" stroke-width="{{hl.grass.w}}" opacity="{{hl.grass.o}}">
          <path pathLength="1" d="M940 640l300-50M944 656l300-50"></path>
          <path pathLength="1" d="M1000 630l2 12M1080 616l2 12M1160 602l2 12"></path>
        </g>
        <g class="g5" stroke="{{hl.galangal.c}}" stroke-width="{{hl.galangal.w}}" opacity="{{hl.galangal.o}}">
          <path pathLength="1" d="M960 670c14-12 46-10 64-2 18-8 40-4 46 8 4 12-8 20-24 18-18 8-52 8-70 0-14 2-24-12-16-24z"></path>
          <path pathLength="1" d="M1000 668v-8M1040 670v-8"></path>
        </g>
        <g class="g5" stroke="{{hl.leaf.c}}" stroke-width="{{hl.leaf.w}}" opacity="{{hl.leaf.o}}">
          <path pathLength="1" d="M1150 650c20-24 54-24 70 0-20 22-52 22-70 0z"></path><path pathLength="1" d="M1150 650h70"></path>
          <path pathLength="1" d="M1200 676c20-24 54-24 70 0-20 22-52 22-70 0z"></path><path pathLength="1" d="M1200 676h70"></path>
        </g>
        <g class="g4" stroke="{{hl.garnish.c}}" stroke-width="{{hl.garnish.w}}" opacity="{{hl.garnish.o}}">
          <path pathLength="1" d="M470 190c20-30 54-30 74 0-20 30-54 30-74 0z"></path><path pathLength="1" d="M470 190h74"></path>
          <path pathLength="1" d="M600 180l40 40M620 170l-10 20M630 196l-14 6"></path>
          <path pathLength="1" d="M680 160c26 0 48 22 48 48h-48z"></path>
          <circle pathLength="1" cx="790" cy="190" r="4"></circle><circle pathLength="1" cx="806" cy="204" r="3"></circle><circle pathLength="1" cx="778" cy="210" r="3"></circle><circle pathLength="1" cx="800" cy="178" r="3"></circle>
        </g>
        <g stroke="none" fill="#1f1c19" font-family="ABC Arizona Sans, sans-serif" font-size="13" letter-spacing="0">
          <text class="fade" x="640" y="406" text-anchor="middle" font-weight="600" opacity="{{hl.pot.o}}">2 litres</text>
          <text class="fade" x="640" y="421" text-anchor="middle" opacity="{{hl.pot.o}}">chicken broth</text>
          <text class="fade" x="140" y="190" opacity="{{hl.chicken.o}}">1 chicken, about 1.2 kg</text>
          <text class="fade" x="110" y="507" opacity="{{hl.shallot.o}}">8 shallots</text>
          <text class="fade" x="110" y="596" opacity="{{hl.garlic.o}}">5 cloves garlic</text>
          <text class="fade" x="104" y="676" opacity="{{hl.nut.o}}">3 candlenuts</text>
          <text class="fade" x="262" y="690" opacity="{{hl.turmeric.o}}">4 cm turmeric</text>
          <text class="fade" x="530" y="696" text-anchor="middle" opacity="{{hl.noodle.o}}">100 g glass noodles</text>
          <text class="fade" x="790" y="696" opacity="{{hl.sprout.o}}">150 g bean sprouts</text>
          <text class="fade" x="1090" y="566" text-anchor="middle" opacity="{{hl.egg.o}}">3 eggs, boiled and halved</text>
          <text class="fade" x="1250" y="582" text-anchor="end" opacity="{{hl.grass.o}}">2 stalks lemongrass</text>
          <text class="fade" x="960" y="704" opacity="{{hl.galangal.o}}">3 cm galangal</text>
          <text class="fade" x="1290" y="704" text-anchor="end" opacity="{{hl.leaf.o}}">4 lime leaves</text>
          <text class="fade" x="470" y="240" opacity="{{hl.garnish.o}}">Celery, fried shallots, koya and lime to finish</text>
        </g>
      </svg>

      <div style="position: absolute; left: 22px; top: 4px; width: 400px; border-bottom: 2px solid #1f1c19; padding-bottom: 12px">
        <p style="margin: 0; font-family: ABC Arizona Flare, Georgia, serif; font-weight: 400; font-size: 24px; line-height: 28px; color: #6b645a">Cook this board</p>
        <p style="margin: 2px 0 0; font-family: ABC Arizona Flare, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 44px; letter-spacing: -.01em">Soto ayam</p>
        <p style="margin: 10px 0 0; font-size: 14px; line-height: 20px; color: #6b645a">Oma Lien’s recipe, Surabaya style, serves 6</p>
      </div>

      <section class="stepzone" aria-label="Steps" style="position: absolute; right: 20px; top: 0; width: 440px; height: 360px" onMouseLeave="{{resume}}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px">
          <button type="button" class="peek press" onClick="{{toggleAll}}" aria-pressed="{{allMode}}" aria-label="{{peekLabel}}" title="{{peekLabel}}" style="height: 36px; border: 0; border-radius: 0; background: transparent; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; cursor: pointer; color: #6b645a; font: 500 14px/1 ABC Arizona Sans, sans-serif">
            <sc-if value="{{oneMode}}" hint-placeholder-val="{{true}}"><svg class="blurin" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 5h9M7 10h9M7 15h9"></path><path d="M3.5 5h.01M3.5 10h.01M3.5 15h.01" stroke-width="2.4"></path></svg></sc-if>
            <sc-if value="{{allMode}}" hint-placeholder-val="{{false}}"><svg class="blurin" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12l4-4 4 4"></path></svg></sc-if>
            <span class="peek-label">{{peekText}}</span>
          </button>
          <div style="display: flex; gap: 8px">
            <button type="button" class="press" aria-label="Previous step" onClick="{{prev}}" style="width: 40px; height: 40px; border: 0; border-radius: 0; background: #ece7de; box-shadow: none; display: grid; place-items: center; cursor: pointer; color: #1f1c19">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5-5 5 5"></path></svg>
            </button>
            <button type="button" class="press" aria-label="Next step" onClick="{{next}}" style="width: 40px; height: 40px; border: 0; border-radius: 0; background: #ece7de; box-shadow: none; display: grid; place-items: center; cursor: pointer; color: #1f1c19">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"></path></svg>
            </button>
            <div style="position: relative; padding: 5px; margin: -5px -5px -5px 0">
              <svg width="{{trW}}" height="{{trH}}" viewBox="0 0 {{trW}} {{trH}}" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none">
                <rect x="1.25" y="1.25" width="{{trIW}}" height="{{trIH}}" rx="{{trR}}" stroke="{{trColor}}" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="{{trDash}}" style="filter: drop-shadow(0 0 4px {{trGlow}}) drop-shadow(0 0 8px {{trGlow}})"></rect>
              </svg>
              <button type="button" class="press" onClick="{{startCooking}}" aria-live="polite" style="position: relative; width: 112px; height: 40px; border: 0; border-radius: 0; background: {{goBg}}; color: #ffffff; font: 600 14px/1 ABC Arizona Sans, sans-serif; cursor: pointer; box-shadow: 0 1px 2px rgba(31,28,25,.18); transition: background-color .24s ease">
                <sc-if value="{{goIdle}}" hint-placeholder-val="{{true}}"><span class="blurin" style="display: inline-flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17c-2.9 0-5-2-5-4.7 0-2.7 2.1-4 2.6-6.6 1 1.1 1.5 2.1 1.5 3.4C10.3 7.4 11.3 5.2 10.8 3c2.7 1.7 4.2 4.6 4.2 7.4C15 14.6 13 17 10 17z"></path></svg>Start</span></sc-if>
                <sc-if value="{{goBusy}}" hint-placeholder-val="{{false}}"><span class="blurin" style="font-variant-numeric: tabular-nums">{{goPct}}%</span></sc-if>
                <sc-if value="{{goDone}}" hint-placeholder-val="{{false}}"><span class="blurin" style="display: inline-flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 6.8"></path></svg>Cooking</span></sc-if>
              </button>
            </div>
          </div>
        </div>
        <sc-if value="{{oneMode}}" hint-placeholder-val="{{true}}">
        <ol style="position: relative; list-style: none; margin: 0; padding: 0; height: 300px; overflow: hidden">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="8">
            <li class="row" onMouseEnter="{{s.hover}}" onClick="{{s.hover}}" aria-current="{{s.current}}" style="position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 12px; cursor: pointer; transform: translateY({{s.y}}px); opacity: {{s.opacity}}; filter: blur({{s.blur}}px); font-size: {{s.size}}px; line-height: {{s.lh}}px; font-weight: {{s.weight}}; pointer-events: {{s.pe}}">
              <span style="flex: none; width: 24px; height: 24px; margin-top: 2px; border: 1.3px solid {{s.ring}}; background: {{s.fill}}; color: {{s.numColor}}; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; transition: background-color .24s ease, color .24s ease">{{s.n}}</span>
              <span style="position: relative; flex: 1; padding-bottom: 6px">{{s.text}}<span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 2px; width: {{s.bar}}%; background: #1f1c19"></span></span>
            </li>
          </sc-for>
        </ol>
        </sc-if>
        <sc-if value="{{allMode}}" hint-placeholder-val="{{false}}">
          <div class="blurin" style="display: flex; flex-direction: column; gap: 2px; height: 300px; overflow: auto">
            <sc-for list="{{phases}}" as="ph" hint-placeholder-count="4">
              <div style="position: relative; padding-left: 16px">
                <span aria-hidden="true" style="position: absolute; left: 0; top: 9px; width: 3px; height: 20px; border-radius: 0; background: {{ph.bar}}; transition: background-color .3s ease"></span>
                <button type="button" onClick="{{ph.open}}" aria-expanded="{{ph.isOpen}}" style="border: 0; background: transparent; padding: 6px 0; font: {{ph.weight}} 18px/26px ABC Arizona Sans, sans-serif; color: {{ph.color}}; cursor: pointer; transition: color .3s ease">{{ph.name}}</button>
                <sc-if value="{{ph.isOpen}}" hint-placeholder-val="{{false}}">
                  <ul class="blurin" style="list-style: none; margin: 0 0 6px; padding: 0 0 0 4px">
                    <sc-for list="{{ph.steps}}" as="st" hint-placeholder-count="3">
                      <li onClick="{{st.pick}}" onMouseEnter="{{st.pick}}" style="position: relative; padding: 7px 0 7px 30px; cursor: pointer">
                        <span aria-hidden="true" style="position: absolute; left: 0; top: 0; height: {{st.railH}}; width: 0; border-left: 1.5px solid #d9d3c8"></span>
                        <span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 16px; height: 50%; border-left: 1.5px solid {{st.elbow}}; border-bottom: 1.5px solid {{st.elbow}}; border-bottom-left-radius: 9px; transition: border-color .3s ease"></span>
                        <span style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 21px; color: {{st.color}}; font-weight: {{st.weight}}; transition: color .3s ease">
                          <span style="flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.3px solid {{st.ring}}; background: {{st.fill}}; color: {{st.numColor}}; display: grid; place-items: center; font-size: 10px; font-weight: 500; transition: background-color .3s ease, color .3s ease, border-color .3s ease">{{st.n}}</span>
                          <span>{{st.text}}</span>
                        </span>
                      </li>
                    </sc-for>
                  </ul>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </section>

    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
var TABS = ['Klepon', 'Soto ayam', 'Rendang padang', 'Kue lapis'];
var STEPS = [
  { t: 'Rinse the chicken. Simmer it in 2 litres of salted water for 30 minutes.', g: ['chicken', 'pot'] },
  { t: 'Pound shallots, garlic, candlenuts and turmeric into a smooth paste.', g: ['shallot', 'garlic', 'nut', 'turmeric'] },
  { t: 'Fry the paste with lemongrass, galangal and lime leaves until fragrant.', g: ['grass', 'galangal', 'leaf'] },
  { t: 'Stir the paste into the broth. Simmer 20 minutes more.', g: ['pot'] },
  { t: 'Lift out the chicken and shred it into thin strips.', g: ['chicken'] },
  { t: 'Soak the glass noodles. Blanch the bean sprouts.', g: ['noodle', 'sprout'] },
  { t: 'Boil the eggs for 9 minutes, then halve them.', g: ['egg'] },
  { t: 'Build each bowl, pour the hot broth over, then top with celery, fried shallots, koya and lime.', g: ['pot', 'garnish', 'noodle', 'egg'] }
];
var PHASES = [{ name: 'The broth', steps: [0, 3] }, { name: 'The spice paste', steps: [1, 2] }, { name: 'Chicken and toppings', steps: [4, 5, 6] }, { name: 'Build the bowl', steps: [7] }];
var GROUPS = ['pot', 'chicken', 'shallot', 'garlic', 'nut', 'turmeric', 'noodle', 'sprout', 'egg', 'grass', 'galangal', 'leaf', 'garnish'];
var TRW = 112 + 10, TRH = 40 + 10;
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 1, step: 0, prog: 0, hover: false, mode: 'one', rec: 'idle', recSec: 0, trace: 0, tracing: false }; }
  componentDidMount() {
    this.tick = setInterval(() => {
      if (this.state.hover || this.state.mode === 'all') return;
      var p = this.state.prog + 0.016;
      if (p >= 1) this.setState({ step: (this.state.step + 1) % STEPS.length, prog: 0 }); else this.setState({ prog: p });
    }, 60);
    this.clock = setInterval(() => { if (this.state.rec === 'on') this.setState({ recSec: this.state.recSec + 1 }); }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); clearInterval(this.clock); clearTimeout(this.t1); cancelAnimationFrame(this.raf); }
  go(i) { this.setState({ step: (i + STEPS.length) % STEPS.length, prog: 0 }); }
  renderVals() {
    var s = this.state, active = STEPS[s.step].g, all = s.mode === 'all';
    var hl = {};
    GROUPS.forEach(function (g) {
      var on = active.indexOf(g) >= 0;
      hl[g] = { c: on ? '#c96a12' : '#1f1c19', w: on ? 2.2 : 1.3, o: on ? 1 : 0.2 };
    });
    var mm = Math.floor(s.recSec / 60), ss = s.recSec % 60, done = s.trace >= 1;
    return {
      tabs: TABS.map((name, i) => {
        var on = i === s.tab;
        return { name: name, active: on, k0: i === 0, k1: i === 1, k2: i === 2, k3: i === 3, ink: on ? '#1f1c19' : '#1f1c19',
          h: on ? 56 : 52, r: 0, padL: on ? 12 : 15, padR: on ? 18 : 15, bg: on ? '#ffffff' : '#ece7de',
          shadow: on ? '0 0 0 1px rgba(31,28,25,.06), 0 1px 2px rgba(31,28,25,.05), 0 8px 24px rgba(31,28,25,.07)' : 'none',
          pick: () => this.setState({ tab: i }) };
      }),
      steps: STEPS.map((st, i) => {
        var d = i - s.step, cur = d === 0;
        var y, op, blur, size, lh, weight;
        if (all) { y = i * 37; op = cur ? 1 : 0.7; blur = 0; size = 14; lh = 18; weight = cur ? 600 : 400; }
        else {
          y = d < 0 ? -60 : d === 0 ? 0 : 96 + (d - 1) * 64;
          op = d < 0 ? 0 : d === 0 ? 1 : d === 1 ? 0.5 : d === 2 ? 0.22 : 0;
          blur = d <= 0 ? (d < 0 ? 6 : 0) : d === 1 ? 1.6 : 3.5;
          size = cur ? 22 : 17; lh = cur ? 30 : 24; weight = cur ? 600 : 400;
        }
        return {
          n: i + 1, text: st.t, current: cur ? 'step' : 'false', y: y, opacity: op, blur: blur, size: size, lh: lh, weight: weight,
          pe: op > 0.1 ? 'auto' : 'none',
          ring: cur ? '#1f1c19' : '#1f1c19', fill: cur ? '#1f1c19' : 'transparent', numColor: cur ? '#ffffff' : '#1f1c19',
          bar: cur && !all ? Math.round((s.hover ? 1 : s.prog) * 100) : 0,
          hover: () => this.setState({ step: i, hover: true, prog: 0 })
        };
      }),
      resume: () => this.setState({ hover: false }),
      oneMode: !all, allMode: all,
      phases: PHASES.map((ph, pi) => {
        var holds = ph.steps.indexOf(s.step) >= 0, open = s.openPh == null ? holds : s.openPh === pi;
        return {
          name: ph.name, isOpen: open, bar: holds ? '#1f1c19' : 'transparent',
          color: holds || open ? '#1f1c19' : '#8c8376', weight: holds ? 500 : 400,
          open: () => this.setState({ openPh: open && s.openPh === pi ? -1 : pi }),
          steps: ph.steps.map((si, k) => {
            var cur = si === s.step;
            return {
              n: si + 1, text: STEPS[si].t, railH: k === ph.steps.length - 1 ? '50%' : '100%',
              elbow: cur ? '#1f1c19' : '#d9d3c8', color: cur ? '#1f1c19' : '#6b645a', weight: cur ? 500 : 400,
              ring: cur ? '#1f1c19' : '#b5ada1', fill: cur ? '#1f1c19' : 'transparent', numColor: cur ? '#ffffff' : '#6b645a',
              pick: () => this.setState({ step: si, prog: 0 })
            };
          })
        };
      }),
      pillX: all ? 116 : 0, pillW: all ? 92 : 116,
      oneColor: all ? '#6b645a' : '#1f1c19', allColor: all ? '#1f1c19' : '#6b645a',
      toggleAll: () => this.setState({ mode: all ? 'one' : 'all', prog: 0, openPh: null }),
      peekLabel: all ? 'Back to one step' : 'Show all steps', peekText: all ? 'One step' : 'All steps',
      prev: () => this.go(s.step - 1), next: () => this.go(s.step + 1),
      hl: hl,
      recIdle: s.rec === 'idle', recStarting: s.rec === 'starting', recOn: s.rec === 'on',
      recTime: mm + ':' + (ss < 10 ? '0' : '') + ss,
      toggleRec: () => {
        if (s.rec === 'idle') { this.setState({ rec: 'starting', recSec: 0 }); this.t1 = setTimeout(() => this.setState({ rec: 'on' }), 900); }
        else if (s.rec === 'on') this.setState({ rec: 'idle' });
      },
      trW: TRW, trH: TRH, trIW: TRW - 2.5, trIH: TRH - 2.5, trR: 0,
      trDash: (s.trace * 100).toFixed(2) + ' ' + (100.001 - s.trace * 100).toFixed(2),
      trColor: s.tracing ? (done ? '#2c6a39' : '#ec923b') : 'rgba(0,0,0,0)', trGlow: done ? 'rgba(44,106,57,0)' : '#ec923b',
      goBg: done ? '#2c6a39' : '#1f1c19',
      goIdle: !s.tracing, goBusy: s.tracing && !done, goDone: s.tracing && done, goPct: Math.round(s.trace * 100),
      startCooking: () => {
        if (s.tracing) return;
        var t0 = performance.now();
        this.setState({ tracing: true, trace: 0, step: 0, prog: 0, mode: 'one', hover: false });
        var f = (now) => {
          var x = Math.min(1, (now - t0) / 2600);
          this.setState({ trace: x });
          if (x < 1) this.raf = requestAnimationFrame(f);
          else this.t1 = setTimeout(() => this.setState({ tracing: false, trace: 0 }), 2200);
        };
        this.raf = requestAnimationFrame(f);
      }
    };
  }
}
</script>
